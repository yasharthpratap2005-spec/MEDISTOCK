<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDISTOCK — Redirecting...</title>
    <script>
        // GitHub Pages SPA / direct link fallback redirect
        const path = window.location.pathname;
        if (path.includes('/pages/')) {
            // Keep on page
        } else {
            const token = localStorage.getItem('medistock_token');
            window.location.href = token ? 'pages/dashboard.html' : 'pages/login.html';
        }
    </script>
</head>
<body>
    <div style="font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
        <div style="text-align:center;">
            <h2>MEDISTOCK</h2>
            <p>Redirecting to application...</p>
            <p><small>If not redirected automatically, <a href="pages/login.html" style="color:#60a5fa">click here</a>.</small></p>
        </div>
    </div>
</body>
</html>
