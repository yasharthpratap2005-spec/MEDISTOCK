<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — MEDISTOCK</title>
    <meta name="description" content="MEDISTOCK Pharmacy Configuration & System Settings">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="topnav-container"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">System Settings & Pharmacy Profile</h1>
                    <div class="page-subtitle">Configure operational thresholds, compliance identifiers, and database backups</div>
                </div>
                <button class="btn-primary-custom" onclick="saveSettings()">
                    <i class="bi bi-check2"></i> Save Configuration
                </button>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
                <!-- Pharmacy Profile Card -->
                <div class="card" style="margin-bottom:0">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-hospital" style="color:#2563eb"></i> Pharmacy Profile</div>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label class="form-label required">Pharmacy / Institution Name</label>
                            <input type="text" class="form-control-custom" id="s-pharmacy-name" value="MEDISTOCK Central Health Pharmacy">
                        </div>
                        <div class="form-group">
                            <label class="form-label required">Drug License Number</label>
                            <input type="text" class="form-control-custom" id="s-license" value="DL-MH-2024-99812A">
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                            <div class="form-group">
                                <label class="form-label required">GSTIN / Tax ID</label>
                                <input type="text" class="form-control-custom" id="s-gstin" value="27AAAPL1234F1Z5">
                            </div>
                            <div class="form-group">
                                <label class="form-label required">Contact Phone</label>
                                <input type="text" class="form-control-custom" id="s-phone" value="+91 98200 11223">
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom:0">
                            <label class="form-label">Operating Address</label>
                            <input type="text" class="form-control-custom" id="s-address" value="Sector 4, Institutional Area, New Delhi, India">
                        </div>
                    </div>
                </div>

                <!-- Inventory Automation Thresholds Card -->
                <div class="card" style="margin-bottom:0">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-sliders" style="color:#16a34a"></i> Inventory Rules & Defaults</div>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label class="form-label required">Default Reorder Threshold (Units)</label>
                            <input type="number" class="form-control-custom" id="s-min-stock" value="30" min="1">
                        </div>
                        <div class="form-group">
                            <label class="form-label required">Expiry Warning Horizon (Days)</label>
                            <input type="number" class="form-control-custom" id="s-exp-horizon" value="90" min="1">
                        </div>
                        <div class="form-group">
                            <label class="form-label required">Currency Standard</label>
                            <select class="form-control-custom" id="s-currency">
                                <option value="INR">₹ Indian Rupee (INR)</option>
                                <option value="USD">$ US Dollar (USD)</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom:0">
                            <label class="form-label">System Timezone</label>
                            <input type="text" class="form-control-custom" value="Asia/Kolkata (IST +5:30)" disabled style="background:#f8fafc">
                        </div>
                    </div>
                </div>

                <!-- Data Backup & Master Reset Card -->
                <div class="card" style="grid-column:span 2">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-database-check" style="color:#0891b2"></i> Local Data Management</div>
                    </div>
                    <div class="card-body" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
                        <div>
                            <div style="font-weight:700;color:#0f172a;margin-bottom:4px">Export Database Backup</div>
                            <div style="font-size:12.5px;color:#64748b">Download a JSON snapshot of current stock levels, products, and user settings.</div>
                        </div>
                        <div style="display:flex;gap:10px">
                            <button class="btn-secondary-custom" onclick="exportDataBackup()">
                                <i class="bi bi-download"></i> Backup JSON
                            </button>
                            <button class="btn-secondary-custom" style="color:#dc2626;border-color:#fca5a5" onclick="resetMasterData()">
                                <i class="bi bi-arrow-counterclockwise"></i> Reset to 124 SKUs
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script>
        if (!initLayout('Settings')) {}
        if (!auth.guardAdminRoute()) {}

        function saveSettings() {
            toast.show('Pharmacy profile & system settings saved!', 'success');
        }

        function exportDataBackup() {
            const data = localStorage.getItem('medistock_products_v3') || '[]';
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `medistock_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            toast.show('Backup downloaded successfully', 'success');
        }

        function resetMasterData() {
            if (confirm('Are you sure you want to reset the catalogue to the master 124-product baseline?')) {
                localStorage.removeItem('medistock_products_v3');
                toast.show('Catalogue reset to master data', 'success');
                setTimeout(() => window.location.reload(), 600);
            }
        }
    </script>
</body>
</html>
