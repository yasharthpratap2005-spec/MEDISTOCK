<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — MEDISTOCK</title>
    <meta name="description" content="MEDISTOCK user management - admin only">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="topnav-container"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">User Management</h1>
                    <p class="page-subtitle">Manage staff accounts and access control</p>
                </div>
                <button class="btn-primary-custom" onclick="openAddModal()">
                    <i class="bi bi-person-plus"></i> Add User
                </button>
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="7"><div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal-overlay" id="user-modal">
        <div class="modal-box" style="max-width:460px">
            <div class="modal-header">
                <h5 class="modal-title">Add User</h5>
                <button class="modal-close" onclick="closeModal('user-modal')"><i class="bi bi-x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label required">Full Name</label>
                    <input type="text" class="form-control-custom" id="u-name" placeholder="Enter full name" required>
                    <div class="form-error" id="e-uname"></div>
                </div>
                <div class="form-group">
                    <label class="form-label required">Email</label>
                    <input type="email" class="form-control-custom" id="u-email" placeholder="Enter email address" required>
                    <div class="form-error" id="e-uemail"></div>
                </div>
                <div class="form-group">
                    <label class="form-label required">Password</label>
                    <input type="password" class="form-control-custom" id="u-password" placeholder="Min 6 characters" required>
                    <div class="form-error" id="e-upassword"></div>
                </div>
                <div class="form-group">
                    <label class="form-label required">Role</label>
                    <select class="form-control-custom" id="u-role">
                        <option value="STAFF">Staff</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary-custom" onclick="closeModal('user-modal')">Cancel</button>
                <button class="btn-primary-custom" onclick="saveUser()" id="btn-save-user">
                    <i class="bi bi-check2"></i> Create User
                </button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script>
        if (!initLayout('Staff & User Management')) {}
        if (!auth.requireAdmin()) {
            document.querySelector('.page-content').innerHTML = `
                <div class="access-denied-box">
                    <div class="access-denied-icon"><i class="bi bi-shield-lock-fill"></i></div>
                    <h3 style="margin:0 0 8px;font-size:20px;color:#0f172a">Access Denied</h3>
                    <p style="color:#64748b;font-size:14px;margin:0 0 20px">Administrative role required to view User & Staff Accounts.</p>
                    <a href="dashboard.html" class="btn-primary-custom" style="text-decoration:none">Return to Dashboard</a>
                </div>
            `;
        } else {
            loadUsers();
        }

        const currentUser = auth.getUser();

        async function loadUsers() {
            const tbody = document.getElementById('users-tbody');
            try {
                const res = await api.getUsers();
                const users = res?.data || [];
                if (users.length === 0) { showEmptyState(tbody, 'No users found', 'bi-people'); return; }
                tbody.innerHTML = users.map((u, i) => `
                    <tr>
                        <td style="color:#94a3b8;font-size:12px">${i+1}</td>
                        <td>
                            <div style="display:flex;align-items:center;gap:10px">
                                <div style="width:36px;height:36px;border-radius:50%;background:${u.role === 'ADMIN' ? '#dbeafe' : '#dcfce7'};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:${u.role === 'ADMIN' ? '#2563eb' : '#16a34a'}">
                                    ${u.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <div style="font-weight:600">${u.name}</div>
                                    ${u.email === currentUser?.email ? '<div style="font-size:11px;color:#2563eb">(You)</div>' : ''}
                                </div>
                            </div>
                        </td>
                        <td style="color:#64748b">${u.email}</td>
                        <td>
                            <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;
                                ${u.role === 'ADMIN' ? 'background:#dbeafe;color:#1d4ed8' : 'background:#dcfce7;color:#16a34a'}">
                                ${u.role}
                            </span>
                        </td>
                        <td>
                            <span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;
                                ${u.active ? 'background:#dcfce7;color:#16a34a' : 'background:#f1f5f9;color:#64748b'}">
                                ${u.active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td style="font-size:12px;color:#64748b">${fmt.date(u.createdAt)}</td>
                        <td>
                            ${u.email !== currentUser?.email ? `
                            <button class="btn-icon ${u.active ? 'danger' : 'success'}" onclick="toggleUserStatus(${u.id},'${u.name.replace(/'/g,"\\'")}',${u.active})" title="${u.active ? 'Deactivate' : 'Activate'}">
                                <i class="bi bi-${u.active ? 'person-dash' : 'person-check'}"></i>
                            </button>
                            ` : '<span style="font-size:12px;color:#94a3b8">You</span>'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                toast.show('Failed to load users: ' + err.message, 'error');
                showEmptyState(tbody, 'Failed to load users', 'bi-exclamation-circle');
            }
        }

        function openAddModal() {
            document.getElementById('u-name').value = '';
            document.getElementById('u-email').value = '';
            document.getElementById('u-password').value = '';
            document.getElementById('u-role').value = 'STAFF';
            ['e-uname','e-uemail','e-upassword'].forEach(id => document.getElementById(id).textContent = '');
            openModal('user-modal');
        }

        async function saveUser() {
            let valid = true;
            const name = document.getElementById('u-name').value.trim();
            const email = document.getElementById('u-email').value.trim();
            const password = document.getElementById('u-password').value;
            const role = document.getElementById('u-role').value;

            if (!name) { document.getElementById('e-uname').textContent = 'Name is required'; valid = false; }
            else document.getElementById('e-uname').textContent = '';
            if (!email) { document.getElementById('e-uemail').textContent = 'Email is required'; valid = false; }
            else document.getElementById('e-uemail').textContent = '';
            if (!password || password.length < 6) { document.getElementById('e-upassword').textContent = 'Password must be at least 6 characters'; valid = false; }
            else document.getElementById('e-upassword').textContent = '';

            if (!valid) return;

            const btn = document.getElementById('btn-save-user');
            btn.disabled = true;
            try {
                await api.createUser({ name, email, password, role });
                toast.show('User created successfully!', 'success');
                closeModal('user-modal');
                loadUsers();
            } catch (err) {
                toast.show(err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function toggleUserStatus(id, name, currentlyActive) {
            if (!confirm(`${currentlyActive ? 'Deactivate' : 'Activate'} user "${name}"?`)) return;
            try {
                await api.toggleUserStatus(id);
                toast.show(`User ${currentlyActive ? 'deactivated' : 'activated'}!`, 'success');
                loadUsers();
            } catch (err) {
                toast.show(err.message, 'error');
            }
        }

        loadUsers();
    </script>
</body>
</html>
