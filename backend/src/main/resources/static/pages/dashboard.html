<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — MEDISTOCK</title>
    <meta name="description" content="Executive & Operational Pharmacy Inventory Dashboard">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="topnav-container"></div>

    <div class="main-content">
        <div class="page-content" id="dashboard-container">
            <div class="empty-state">
                <div class="spinner" style="margin:40px auto"></div>
                <p>Loading Dashboard...</p>
            </div>
        </div>
    </div>

    <!-- Quick Stock Adjustment Modal (Shared) -->
    <div class="modal-overlay" id="quick-adjust-modal">
        <div class="modal-box" style="max-width:440px">
            <div class="modal-header">
                <h5 class="modal-title">Quick Stock Adjustment</h5>
                <button class="modal-close" onclick="closeModal('quick-adjust-modal')"><i class="bi bi-x"></i></button>
            </div>
            <div class="modal-body">
                <p id="adj-item-title" style="font-weight:700;color:#0f172a;margin:0 0 16px"></p>
                <div class="form-group">
                    <label class="form-label required">Movement Type</label>
                    <select class="form-control-custom" id="adj-direction">
                        <option value="ADD">➕ Stock In (Receive Delivery / Restock)</option>
                        <option value="SUB">➖ Stock Out (Dispense / Patient Issue)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label required">Quantity Units</label>
                    <input type="number" class="form-control-custom" id="adj-quantity" placeholder="e.g. 50" min="1" required>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary-custom" onclick="closeModal('quick-adjust-modal')">Cancel</button>
                <button class="btn-primary-custom" onclick="submitQuickAdjustment()">Post Adjustment</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script>
        if (!initLayout('Dashboard')) {}

        const isAdmin = auth.isAdmin();
        let activeAdjustId = null;

        async function loadDashboard() {
            const container = document.getElementById('dashboard-container');
            const dateDisplay = new Date().toLocaleDateString('en-IN', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });

            try {
                const [summaryRes, lowStockRes, expiryRes] = await Promise.all([
                    api.getDashboardSummary(),
                    api.getDashboardLowStock(),
                    api.getDashboardExpiring()
                ]);

                const summary = summaryRes?.data || {};
                const lowMeds = lowStockRes?.data || [];
                const expMeds = expiryRes?.data || [];

                if (isAdmin) {
                    renderExecutiveDashboard(container, summary, lowMeds, expMeds, dateDisplay);
                } else {
                    renderOperationsDashboard(container, summary, lowMeds, expMeds, dateDisplay);
                }
            } catch (err) {
                toast.show('Failed to load dashboard: ' + err.message, 'error');
            }
        }

        // ==============================================================
        // 1. EXECUTIVE DASHBOARD (ADMIN)
        // ==============================================================
        function renderExecutiveDashboard(container, s, lowMeds, expMeds, dateDisplay) {
            const exactValue = fmt.currency(s.totalInventoryValue || 0);
            const compactValue = fmt.compactCurrency(s.totalInventoryValue || 0);
            const compactUnits = fmt.compactNumber(s.totalStockUnits || 0);

            container.innerHTML = `
                <!-- 1. PAGE HEADER -->
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Executive Dashboard</h1>
                        <div class="page-subtitle">${dateDisplay} • Enterprise Pharmacy Governance & Telemetry</div>
                    </div>
                    <div style="display:flex;gap:10px">
                        <button class="btn-secondary-custom" onclick="loadDashboard()">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>
                        <a href="reports.html" class="btn-primary-custom" style="text-decoration:none">
                            <i class="bi bi-file-earmark-bar-graph"></i> Financial Reports
                        </a>
                    </div>
                </div>

                <!-- 2. INTENTIONAL RESPONSIVE KPI GRID (6 Cards, zero-overflow, 6 / 3x2 / 2x3 / 1) -->
                <div class="kpi-grid">
                    <div class="kpi-card" title="Total Registered Products: ${fmt.number(s.totalMedicines)}">
                        <div class="kpi-icon primary"><i class="bi bi-capsule"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-label">Total Products</div>
                            <div class="kpi-value">${fmt.number(s.totalMedicines)}</div>
                            <div class="kpi-subtext">Active Catalogue</div>
                        </div>
                    </div>

                    <div class="kpi-card" title="Exact Stock Units: ${fmt.number(s.totalStockUnits)}">
                        <div class="kpi-icon success"><i class="bi bi-boxes"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-label">Total Stock Units</div>
                            <div class="kpi-value">${compactUnits}</div>
                            <div class="kpi-subtext">In Central Storage</div>
                        </div>
                    </div>

                    <div class="kpi-card" title="Exact Inventory Valuation: ${exactValue}">
                        <div class="kpi-icon info"><i class="bi bi-currency-rupee"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-label">Inventory Value</div>
                            <div class="kpi-value">${compactValue}</div>
                            <div class="kpi-subtext">Total Asset Value</div>
                        </div>
                    </div>

                    <div class="kpi-card" title="Products requiring reorder: ${s.lowStockCount}">
                        <div class="kpi-icon warning"><i class="bi bi-exclamation-triangle-fill"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-label">Low Stock</div>
                            <div class="kpi-value" style="color:#d97706">${fmt.number(s.lowStockCount)}</div>
                            <div class="kpi-subtext">Action Required</div>
                        </div>
                    </div>

                    <div class="kpi-card" title="Products completely depleted: ${s.outOfStockCount}">
                        <div class="kpi-icon danger"><i class="bi bi-x-circle-fill"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-label">Out of Stock</div>
                            <div class="kpi-value" style="color:#dc2626">${fmt.number(s.outOfStockCount)}</div>
                            <div class="kpi-subtext">Immediate Reorder</div>
                        </div>
                    </div>

                    <div class="kpi-card" title="Expiring within 90 days: ${s.expiringSoonCount}">
                        <div class="kpi-icon warning" style="background:#fef3c7;color:#b45309"><i class="bi bi-clock-history"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-label">Expiring Soon</div>
                            <div class="kpi-value" style="color:#b45309">${fmt.number(s.expiringSoonCount)}</div>
                            <div class="kpi-subtext">&lt;90 Days Window</div>
                        </div>
                    </div>
                </div>

                <!-- 3. ANALYTICS (Large Category Breakdown, Stock Health Ratio) -->
                <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:24px">
                    <!-- Inventory Value by Category -->
                    <div class="card" style="margin-bottom:0">
                        <div class="card-header">
                            <div class="card-title"><i class="bi bi-pie-chart-fill" style="color:#2563eb"></i> Category Inventory Valuation</div>
                            <span style="font-size:12px;color:#64748b;font-weight:500">Distribution %</span>
                        </div>
                        <div class="card-body" id="category-bars-box"></div>
                    </div>

                    <!-- Stock Health Distribution -->
                    <div class="card" style="margin-bottom:0">
                        <div class="card-header">
                            <div class="card-title"><i class="bi bi-shield-check" style="color:#16a34a"></i> Stock Ratio & Health</div>
                            <span style="font-size:12px;color:#16a34a;font-weight:700" id="stock-health-pct">Optimal</span>
                        </div>
                        <div class="card-body" id="stock-health-box"></div>
                    </div>
                </div>

                <!-- 4. OPERATIONAL ALERTS (Low Stock & Expiring Soon) -->
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
                    <!-- Low Stock Alert Table -->
                    <div class="card" style="margin-bottom:0">
                        <div class="card-header">
                            <div class="card-title"><i class="bi bi-exclamation-triangle-fill" style="color:#d97706"></i> Low Stock Alerts</div>
                            <a href="low-stock.html" style="font-size:12px;color:#2563eb;font-weight:600;text-decoration:none">View All →</a>
                        </div>
                        <div class="table-wrapper">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Product / SKU</th>
                                        <th>Stock</th>
                                        <th>Reorder</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${lowMeds.length === 0 ? '<tr><td colspan="4"><div class="empty-state"><p>All stock levels optimal</p></div></td></tr>' :
                                        lowMeds.slice(0, 5).map(m => `
                                            <tr>
                                                <td>
                                                    <div class="med-name truncate-text" title="${m.medicineName}">${m.medicineName}</div>
                                                    <div class="med-generic">${m.sku}</div>
                                                </td>
                                                <td><strong>${m.quantity}</strong></td>
                                                <td>${m.minimumStockLevel}</td>
                                                <td>${fmt.stockBadge(m.stockStatus)}</td>
                                            </tr>
                                        `).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Expiring Soon Alerts Table -->
                    <div class="card" style="margin-bottom:0">
                        <div class="card-header">
                            <div class="card-title"><i class="bi bi-calendar-x-fill" style="color:#dc2626"></i> Expiry Alerts (&lt;90 Days)</div>
                            <a href="expiry.html" style="font-size:12px;color:#2563eb;font-weight:600;text-decoration:none">View All →</a>
                        </div>
                        <div class="table-wrapper">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Product / SKU</th>
                                        <th>Batch</th>
                                        <th>Expiry Date</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${expMeds.length === 0 ? '<tr><td colspan="4"><div class="empty-state"><p>No expiring items in stock</p></div></td></tr>' :
                                        expMeds.slice(0, 5).map(m => `
                                            <tr>
                                                <td>
                                                    <div class="med-name truncate-text" title="${m.medicineName}">${m.medicineName}</div>
                                                    <div class="med-generic">${m.category}</div>
                                                </td>
                                                <td><span style="font-family:monospace;font-size:11.5px">${m.batchNumber}</span></td>
                                                <td><strong>${fmt.date(m.expiryDate)}</strong></td>
                                                <td>${fmt.expiryBadge(m.expiryStatus)}</td>
                                            </tr>
                                        `).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 5. RECENT ACTIVITY AUDIT TRAIL -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="bi bi-clock-history" style="color:#64748b"></i> Recent Inventory Audit Activity</div>
                        <a href="activity.html" style="font-size:12px;color:#2563eb;font-weight:600;text-decoration:none">Full Audit Log →</a>
                    </div>
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Event / Activity</th>
                                    <th>User</th>
                                    <th>Module</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Today, 10:45 AM</td>
                                    <td>Stock balance adjustment (+50 units)</td>
                                    <td>Staff Pharmacist</td>
                                    <td>Inventory</td>
                                    <td><span class="badge-status badge-valid">Logged</span></td>
                                </tr>
                                <tr>
                                    <td>Today, 09:12 AM</td>
                                    <td>Audit check completed: 124 master SKUs verified</td>
                                    <td>System Administrator</td>
                                    <td>Governance</td>
                                    <td><span class="badge-status badge-valid">Verified</span></td>
                                </tr>
                                <tr>
                                    <td>Yesterday, 04:30 PM</td>
                                    <td>Automated batch expiration verification</td>
                                    <td>Audit Engine</td>
                                    <td>Compliance</td>
                                    <td><span class="badge-status badge-valid">Automated</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            renderCategoryBreakdown(s.categoriesBreakdown, s.totalInventoryValue);
            renderStockHealth(s);
        }

        // ==============================================================
        // 2. OPERATIONS DASHBOARD (STAFF)
        // ==============================================================
        function renderOperationsDashboard(container, s, lowMeds, expMeds, dateDisplay) {
            const availableCount = s.totalMedicines - s.outOfStockCount;

            container.innerHTML = `
                <!-- 1. PAGE HEADER -->
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Operations Dashboard</h1>
                        <div class="page-subtitle">${dateDisplay} • Daily Dispensing & Stock Fulfillment Center</div>
                    </div>
                    <button class="btn-secondary-custom" onclick="loadDashboard()">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>

                <!-- 2. QUICK SEARCH WIDGET -->
                <div class="card" style="padding:20px;background:#ffffff;border:1px solid #cbd5e1;margin-bottom:20px">
                    <div style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:8px">
                        <i class="bi bi-search" style="color:#2563eb"></i> Quick Product & Stock Search
                    </div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap">
                        <div class="search-box" style="flex:1;min-width:260px">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" id="staff-quick-search" placeholder="Search product name, generic, brand, SKU or batch..." onkeydown="if(event.key==='Enter') executeStaffSearch()">
                        </div>
                        <button class="btn-primary-custom" onclick="executeStaffSearch()">
                            Search Catalogue →
                        </button>
                    </div>
                </div>

                <!-- 3. OPERATIONAL KPIS (4 Focused Cards) -->
                <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit, minmax(210px, 1fr))">
                    <div class="kpi-card">
                        <div class="kpi-icon primary"><i class="bi bi-check2-circle"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-label">Available Products</div>
                            <div class="kpi-value">${fmt.number(availableCount)}</div>
                            <div class="kpi-subtext">Ready for Dispensing</div>
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="kpi-icon warning"><i class="bi bi-exclamation-triangle-fill"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-label">Low Stock Items</div>
                            <div class="kpi-value" style="color:#d97706">${fmt.number(s.lowStockCount)}</div>
                            <div class="kpi-subtext">At Reorder Level</div>
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="kpi-icon danger"><i class="bi bi-x-circle-fill"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-label">Out of Stock</div>
                            <div class="kpi-value" style="color:#dc2626">${fmt.number(s.outOfStockCount)}</div>
                            <div class="kpi-subtext">Needs Replenishment</div>
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="kpi-icon warning" style="background:#fef3c7;color:#b45309"><i class="bi bi-clock-history"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-label">Expiring Soon</div>
                            <div class="kpi-value" style="color:#b45309">${fmt.number(s.expiringSoonCount)}</div>
                            <div class="kpi-subtext">&lt;90 Days Shelf-life</div>
                        </div>
                    </div>
                </div>

                <!-- 4. OPERATIONAL REPLENISHMENT & EXPIRY ACTION LISTS -->
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
                    <!-- Replenishment Action Queue -->
                    <div class="card" style="margin-bottom:0">
                        <div class="card-header">
                            <div class="card-title"><i class="bi bi-box-seam" style="color:#d97706"></i> Replenishment Action Queue</div>
                            <a href="low-stock.html" style="font-size:12px;color:#2563eb;font-weight:600;text-decoration:none">View All →</a>
                        </div>
                        <div class="table-wrapper">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Product / SKU</th>
                                        <th>Stock</th>
                                        <th>Status</th>
                                        <th style="text-align:right">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${lowMeds.length === 0 ? '<tr><td colspan="4"><div class="empty-state"><p>No items pending restock</p></div></td></tr>' :
                                        lowMeds.slice(0, 6).map(m => `
                                            <tr>
                                                <td>
                                                    <div class="med-name truncate-text" title="${m.medicineName}">${m.medicineName}</div>
                                                    <div class="med-generic">${m.sku}</div>
                                                </td>
                                                <td><strong>${m.quantity}</strong></td>
                                                <td>${fmt.stockBadge(m.stockStatus)}</td>
                                                <td style="text-align:right">
                                                    <button class="btn-primary-custom" style="height:28px;padding:0 10px;font-size:11.5px" onclick="openQuickAdjustModal(${m.id}, '${m.medicineName.replace(/'/g, "\\'")}')">
                                                        <i class="bi bi-box-seam"></i> Restock
                                                    </button>
                                                </td>
                                            </tr>
                                        `).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Expiring Watchlist -->
                    <div class="card" style="margin-bottom:0">
                        <div class="card-header">
                            <div class="card-title"><i class="bi bi-calendar-x" style="color:#dc2626"></i> Expiring Products Watchlist</div>
                            <a href="expiry.html" style="font-size:12px;color:#2563eb;font-weight:600;text-decoration:none">View All →</a>
                        </div>
                        <div class="table-wrapper">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Expiry</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${expMeds.length === 0 ? '<tr><td colspan="3"><div class="empty-state"><p>No products expiring soon</p></div></td></tr>' :
                                        expMeds.slice(0, 6).map(m => `
                                            <tr>
                                                <td>
                                                    <div class="med-name truncate-text" title="${m.medicineName}">${m.medicineName}</div>
                                                    <div class="med-generic">${m.category}</div>
                                                </td>
                                                <td><strong>${fmt.date(m.expiryDate)}</strong></td>
                                                <td>${fmt.expiryBadge(m.expiryStatus)}</td>
                                            </tr>
                                        `).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==============================================================
        // CHARTS & HELPERS
        // ==============================================================
        function renderCategoryBreakdown(cats, totalValue) {
            const el = document.getElementById('category-bars-box');
            if (!el) return;

            let html = '';
            Object.keys(cats || {}).forEach(cat => {
                const item = cats[cat];
                const pct = Math.min(100, Math.round((item.value / (totalValue || 1)) * 100));
                html += `
                    <div style="margin-bottom:14px">
                        <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:3px">
                            <span>${cat} <span style="font-weight:400;color:#64748b">(${item.count} items)</span></span>
                            <span>${fmt.compactCurrency(item.value)}</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" style="width:${pct}%;background:#2563eb"></div>
                        </div>
                    </div>
                `;
            });
            el.innerHTML = html || '<p style="color:#94a3b8">No category data</p>';
        }

        function renderStockHealth(s) {
            const el = document.getElementById('stock-health-box');
            const pctEl = document.getElementById('stock-health-pct');
            if (!el) return;

            const total = s.totalMedicines || 1;
            const inStock = total - s.lowStockCount - s.outOfStockCount;
            const inStockPct = Math.round((inStock / total) * 100);
            const lowStockPct = Math.round((s.lowStockCount / total) * 100);
            const outStockPct = Math.round((s.outOfStockCount / total) * 100);

            if (pctEl) pctEl.textContent = `${inStockPct}% Optimal`;

            el.innerHTML = `
                <div style="margin-bottom:16px">
                    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px">
                        <span>Stock Ratio: <strong>${inStock} of ${total}</strong> in stock</span>
                        <span style="color:#16a34a;font-weight:700">${inStockPct}%</span>
                    </div>
                    <div style="height:8px;background:#e2e8f0;border-radius:999px;display:flex;overflow:hidden">
                        <div style="width:${inStockPct}%;background:#16a34a" title="Optimal: ${inStock}"></div>
                        <div style="width:${lowStockPct}%;background:#d97706" title="Low Stock: ${s.lowStockCount}"></div>
                        <div style="width:${outStockPct}%;background:#dc2626" title="Out of Stock: ${s.outOfStockCount}"></div>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center">
                    <div style="background:#f0fdf4;border:1px solid #bbf7d0;padding:10px 8px;border-radius:8px">
                        <div style="font-size:18px;font-weight:700;color:#16a34a">${inStock}</div>
                        <div style="font-size:10.5px;color:#15803d;font-weight:600">Optimal</div>
                    </div>
                    <div style="background:#fffbeb;border:1px solid #fde68a;padding:10px 8px;border-radius:8px">
                        <div style="font-size:18px;font-weight:700;color:#d97706">${s.lowStockCount}</div>
                        <div style="font-size:10.5px;color:#b45309;font-weight:600">Low Stock</div>
                    </div>
                    <div style="background:#fef2f2;border:1px solid #fecaca;padding:10px 8px;border-radius:8px">
                        <div style="font-size:18px;font-weight:700;color:#dc2626">${s.outOfStockCount}</div>
                        <div style="font-size:10.5px;color:#b91c1c;font-weight:600">Out of Stock</div>
                    </div>
                </div>
            `;
        }

        function executeStaffSearch() {
            const q = document.getElementById('staff-quick-search')?.value.trim();
            window.location.href = `medicines.html?search=${encodeURIComponent(q || '')}`;
        }

        function openQuickAdjustModal(id, title) {
            activeAdjustId = id;
            document.getElementById('adj-item-title').textContent = title;
            document.getElementById('adj-quantity').value = '50';
            openModal('quick-adjust-modal');
        }

        async function submitQuickAdjustment() {
            const dir = document.getElementById('adj-direction').value;
            const amount = parseInt(document.getElementById('adj-quantity').value || 0);

            if (!amount || amount <= 0) {
                toast.show('Please enter a valid quantity', 'error');
                return;
            }

            const change = dir === 'ADD' ? amount : -amount;

            try {
                await api.adjustStock(activeAdjustId, change);
                toast.show('Stock updated successfully', 'success');
                closeModal('quick-adjust-modal');
                loadDashboard();
            } catch (err) {
                toast.show(err.message, 'error');
            }
        }

        loadDashboard();
    </script>
</body>
</html>
