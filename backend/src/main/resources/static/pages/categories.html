<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories Taxonomy — MEDISTOCK</title>
    <meta name="description" content="MEDISTOCK Product Category & Subcategory Taxonomy Management">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="topnav-container"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Category Taxonomy & Structure</h1>
                    <p class="page-subtitle">Product classifications, subcategories, and category inventory metrics</p>
                </div>
                <a href="medicines.html" class="btn-primary-custom" style="text-decoration:none">
                    <i class="bi bi-funnel"></i> Browse Catalogue
                </a>
            </div>

            <!-- Categories Grid Cards -->
            <div id="categories-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px">
                <div class="empty-state"><div class="spinner"></div><p>Calculating category metrics...</p></div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script>
        if (!initLayout('Categories')) {}

        const taxonomy = {
            'Medicines': {
                icon: 'bi-capsule-pill',
                color: '#2563eb',
                subcategories: ['Pain Relief', 'Fever', 'Cold & Cough', 'Antibiotics', 'Gastrointestinal', 'Allergy', 'Respiratory', 'Cardiovascular', 'Diabetes', 'Dermatology']
            },
            'Wellness & Supplements': {
                icon: 'bi-heart-pulse-fill',
                color: '#16a34a',
                subcategories: ['Vitamins', 'Minerals', 'Nutritional Supplements', 'ORS & Hydration']
            },
            'Medical Supplies': {
                icon: 'bi-bandaid-fill',
                color: '#d97706',
                subcategories: ['First Aid', 'Bandages & Dressings', 'Gloves', 'Syringes', 'Antiseptics', 'Other Medical Supplies']
            }
        };

        async function loadCategories() {
            const grid = document.getElementById('categories-grid');
            try {
                const summaryRes = await api.getDashboardSummary();
                const s = summaryRes?.data || {};
                const catsBreakdown = s.categoriesBreakdown || {};

                let html = '';
                Object.keys(taxonomy).forEach(catName => {
                    const info = taxonomy[catName];
                    const catData = catsBreakdown[catName] || { count: 0, units: 0, value: 0 };

                    html += `
                        <div class="card" style="display:flex;flex-direction:column;justify-space-between">
                            <div>
                                <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
                                    <div style="width:44px;height:44px;border-radius:12px;background:${info.color}15;color:${info.color};display:flex;align-items:center;justify-content:center;font-size:22px">
                                        <i class="bi ${info.icon}"></i>
                                    </div>
                                    <div>
                                        <h3 style="font-size:17px;font-weight:700;margin:0;color:#0f172a">${catName}</h3>
                                        <div style="font-size:12px;color:#64748b">${catData.count} Products Registered</div>
                                    </div>
                                </div>

                                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;background:#f8fafc;padding:12px;border-radius:8px">
                                    <div>
                                        <div style="font-size:11px;color:#64748b;font-weight:600">STOCK UNITS</div>
                                        <div style="font-size:16px;font-weight:700;color:#0f172a">${fmt.number(catData.units)}</div>
                                    </div>
                                    <div>
                                        <div style="font-size:11px;color:#64748b;font-weight:600">CATALOGUE VALUE</div>
                                        <div style="font-size:16px;font-weight:700;color:#16a34a">${fmt.currency(catData.value)}</div>
                                    </div>
                                </div>

                                <div style="font-size:12px;font-weight:600;color:#475569;margin-bottom:8px">Subcategories Taxonomy:</div>
                                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">
                                    ${info.subcategories.map(sub => `<span class="subcat-pill">${sub}</span>`).join('')}
                                </div>
                            </div>
                            <div style="border-top:1px solid #e2e8f0;padding-top:12px">
                                <a href="medicines.html" class="btn-secondary-custom" style="width:100%;text-align:center;text-decoration:none;display:block">
                                    View ${catName} Products →
                                </a>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = html;

            } catch (err) {
                toast.show('Failed to load category taxonomy: ' + err.message, 'error');
            }
        }

        loadCategories();
    </script>
</body>
</html>
