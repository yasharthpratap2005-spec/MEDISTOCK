<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Movements — MEDISTOCK</title>
    <meta name="description" content="MEDISTOCK Inventory Management - Stock In, Stock Out and Replenishment">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="topnav-container"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Inventory Stock Movements</h1>
                    <p class="page-subtitle">Track, audit, and adjust stock balances across all product lines</p>
                </div>
                <a href="medicines.html" class="btn-primary-custom" style="text-decoration:none">
                    <i class="bi bi-box-seam"></i> Full Catalogue
                </a>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar" style="margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap">
                <div class="search-box" style="flex:2;min-width:240px">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" id="inv-search" placeholder="Search inventory by product, SKU, batch..." oninput="debouncedSearch()">
                </div>
                <select class="filter-select" id="inv-category" onchange="loadInventory()" style="flex:1;min-width:160px">
                    <option value="ALL">All Categories</option>
                    <option value="Medicines">Medicines</option>
                    <option value="Wellness & Supplements">Wellness & Supplements</option>
                    <option value="Medical Supplies">Medical Supplies</option>
                </select>
                <select class="filter-select" id="inv-status" onchange="loadInventory()" style="flex:1;min-width:140px">
                    <option value="ALL">All Stock Status</option>
                    <option value="IN_STOCK">🟢 In Stock</option>
                    <option value="LOW_STOCK">🟡 Low Stock</option>
                    <option value="OUT_OF_STOCK">🔴 Out of Stock</option>
                </select>
            </div>

            <div class="card" style="padding:0;overflow:hidden">
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Product / SKU</th>
                                <th>Category & Subcategory</th>
                                <th>Batch #</th>
                                <th>Current Stock</th>
                                <th>Reorder Threshold</th>
                                <th>Unit Selling Price</th>
                                <th>Stock Status</th>
                                <th style="text-align:right">Stock Action</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-tbody">
                            <tr><td colspan="8"><div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div><p>Loading inventory...</p></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Stock Adjust Modal -->
    <div class="modal-overlay" id="stock-adjust-modal">
        <div class="modal-box" style="max-width:440px">
            <div class="modal-header">
                <h5 class="modal-title">Record Stock Movement</h5>
                <button class="modal-close" onclick="closeModal('stock-adjust-modal')"><i class="bi bi-x"></i></button>
            </div>
            <div class="modal-body">
                <p id="adj-prod-name" style="font-weight:600;margin:0 0 16px;color:#0f172a"></p>
                <div class="form-group">
                    <label class="form-label">Movement Direction</label>
                    <select class="form-control-custom" id="adj-type">
                        <option value="ADD">➕ Stock In (Receive Delivery / Restock)</option>
                        <option value="SUB">➖ Stock Out (Dispensed / Issue / Damaged)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Quantity</label>
                    <input type="number" class="form-control-custom" id="adj-qty" placeholder="e.g. 50" min="1" required>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary-custom" onclick="closeModal('stock-adjust-modal')">Cancel</button>
                <button class="btn-primary-custom" onclick="confirmStockAdjustment()">Post Movement</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script>
        if (!initLayout('Inventory Movements')) {}

        let adjustId = null;
        const debouncedSearch = debounce(() => loadInventory(), 300);

        async function loadInventory() {
            const tbody = document.getElementById('inventory-tbody');
            const keyword = document.getElementById('inv-search').value;
            const category = document.getElementById('inv-category').value;
            const stockStatus = document.getElementById('inv-status').value;

            try {
                const res = await api.getMedicines({ keyword, category, stockStatus, limit: 300 });
                const meds = res?.data || [];

                if (meds.length === 0) {
                    showEmptyState(tbody, 'No matching inventory items found', 'bi-search');
                    return;
                }

                tbody.innerHTML = meds.map(m => `
                    <tr>
                        <td>
                            <div class="med-name">${m.medicineName}</div>
                            <div class="med-generic">${m.brandName || ''} • <span style="font-family:monospace;color:#2563eb">${m.sku}</span></div>
                        </td>
                        <td>
                            <div><strong>${m.category}</strong></div>
                            <div class="subcat-pill">${m.subcategory || 'General'}</div>
                        </td>
                        <td><span style="font-family:monospace">${m.batchNumber}</span></td>
                        <td><strong style="font-size:15px">${m.quantity} units</strong></td>
                        <td>${m.minimumStockLevel} units</td>
                        <td>${fmt.currency(m.sellingPrice)}</td>
                        <td>${fmt.stockBadge(m.stockStatus)}</td>
                        <td style="text-align:right">
                            <button class="btn-primary-custom" style="padding:4px 10px;font-size:12px" onclick="openStockAdjustModal(${m.id}, '${m.medicineName.replace(/'/g, "\\'")}')">
                                <i class="bi bi-box-seam"></i> Post Movement
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                toast.show('Failed to load inventory: ' + err.message, 'error');
            }
        }

        function openStockAdjustModal(id, name) {
            adjustId = id;
            document.getElementById('adj-prod-name').textContent = name;
            document.getElementById('adj-qty').value = '';
            openModal('stock-adjust-modal');
        }

        async function confirmStockAdjustment() {
            const type = document.getElementById('adj-type').value;
            const amount = parseInt(document.getElementById('adj-qty').value || 0);

            if (!amount || amount <= 0) {
                toast.show('Enter a valid quantity', 'error');
                return;
            }

            const change = type === 'ADD' ? amount : -amount;

            try {
                await api.adjustStock(adjustId, change);
                toast.show('Stock movement posted successfully!', 'success');
                closeModal('stock-adjust-modal');
                loadInventory();
            } catch (e) {
                toast.show(e.message, 'error');
            }
        }

        loadInventory();
    </script>
</body>
</html>
