<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Stock — MEDISTOCK</title>
    <meta name="description" content="MEDISTOCK low stock alert dashboard">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="topnav-container"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Low Stock Alerts</h1>
                    <p class="page-subtitle">Medicines requiring immediate restocking</p>
                </div>
                <a href="inventory.html" class="btn-primary-custom">
                    <i class="bi bi-arrow-left-right"></i> Update Stock
                </a>
            </div>

            <div id="alert-banner" class="alert-warning-custom" style="margin-bottom:20px;display:none">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span id="alert-text"></span>
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Medicine</th>
                            <th>Category</th>
                            <th>Current Qty</th>
                            <th>Min Level</th>
                            <th>Deficit</th>
                            <th>Stock Status</th>
                            <th>Price</th>
                            <th>Expiry</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="low-stock-tbody">
                        <tr><td colspan="10"><div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script>
        if (!initLayout('Low Stock Alerts')) {}

        async function loadLowStock() {
            const tbody = document.getElementById('low-stock-tbody');
            const alertBanner = document.getElementById('alert-banner');
            const alertText = document.getElementById('alert-text');
            try {
                const res = await api.getLowStockMedicines();
                const medicines = res?.data || [];
                if (medicines.length === 0) {
                    alertBanner.style.display = 'none';
                    tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state"><i class="bi bi-check-circle-fill" style="color:#16a34a"></i><h5>All stock levels are adequate</h5><p>No medicines are below their minimum stock level.</p></div></td></tr>`;
                    return;
                }
                alertBanner.style.display = 'flex';
                alertText.textContent = `⚠ WARNING: ${medicines.length} medicine${medicines.length > 1 ? 's are' : ' is'} currently below minimum stock level and require immediate restocking.`;
                tbody.innerHTML = medicines.map((m, i) => {
                    const deficit = m.minimumStockLevel - m.quantity;
                    return `
                    <tr>
                        <td style="color:#94a3b8;font-size:12px">${i+1}</td>
                        <td>
                            <div class="med-name">${m.medicineName}</div>
                            <div class="med-generic">${m.genericName || m.manufacturer}</div>
                        </td>
                        <td><span style="font-size:11px;background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:6px">${m.categoryName}</span></td>
                        <td><span style="font-size:20px;font-weight:700;color:${m.quantity === 0 ? '#dc2626' : '#d97706'}">${m.quantity}</span></td>
                        <td style="color:#64748b">${m.minimumStockLevel}</td>
                        <td>
                            <span style="font-size:13px;font-weight:700;color:#dc2626">
                                ${m.quantity === 0 ? 'All units' : '-' + deficit + ' units'}
                            </span>
                        </td>
                        <td>${fmt.stockBadge(m.stockStatus)}</td>
                        <td style="font-weight:600">${fmt.currency(m.price)}</td>
                        <td style="font-size:12px">${fmt.date(m.expiryDate)} ${fmt.expiryBadge(m.expiryStatus)}</td>
                        <td>
                            <a href="inventory.html" class="btn-icon success" title="Update Stock">
                                <i class="bi bi-plus-circle"></i>
                            </a>
                        </td>
                    </tr>
                    `;
                }).join('');
            } catch (err) {
                toast.show('Failed to load low stock data: ' + err.message, 'error');
                showEmptyState(tbody, 'Failed to load data', 'bi-exclamation-circle');
            }
        }

        loadLowStock();
    </script>
</body>
</html>
