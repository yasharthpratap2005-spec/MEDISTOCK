# Application Properties
spring.application.name=medistock-backend

# Server
server.port=8080

# Active Profile (h2 for zero-setup, mysql for production/MySQL db)
spring.profiles.active=h2

# Database Configuration (MySQL settings used when profile is 'mysql')
spring.datasource.url=jdbc:mysql://localhost:3306/medistock_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# JWT Configuration
app.jwt.secret=MediStockSecretKeyForJWTTokenGeneration2024VeryLongSecureKey
app.jwt.expiration=86400000

# Low stock / expiry thresholds
app.inventory.expiry-warning-days=30

# Logging
logging.level.com.medistock=INFO
logging.level.org.springframework.security=WARN

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
