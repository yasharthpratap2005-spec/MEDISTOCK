<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — MEDISTOCK</title>
    <meta name="description" content="Manage medicine categories in MEDISTOCK">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="topnav-container"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Categories</h1>
                    <p class="page-subtitle">Manage medicine categories for better organization</p>
                </div>
                <button class="btn-primary-custom" onclick="openAddModal()">
                    <i class="bi bi-plus-lg"></i> Add Category
                </button>
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Category Name</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="categories-tbody">
                        <tr><td colspan="5"><div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div><p>Loading categories...</p></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Category Modal -->
    <div class="modal-overlay" id="category-modal">
        <div class="modal-box" style="max-width:460px">
            <div class="modal-header">
                <h5 class="modal-title" id="cat-modal-title">Add Category</h5>
                <button class="modal-close" onclick="closeModal('category-modal')"><i class="bi bi-x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label required">Category Name</label>
                    <input type="text" class="form-control-custom" id="c-name" placeholder="e.g., Pain Relief" required>
                    <div class="form-error" id="e-cname"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-control-custom" id="c-desc" rows="3" placeholder="Brief description..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary-custom" onclick="closeModal('category-modal')">Cancel</button>
                <button class="btn-primary-custom" onclick="saveCategory()" id="btn-save-cat">
                    <i class="bi bi-check2"></i> Save
                </button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script>
        if (!initLayout('Categories')) {}
        if (!auth.isAdmin()) { window.location.href = 'dashboard.html'; }

        let editingCatId = null;

        async function loadCategories() {
            const tbody = document.getElementById('categories-tbody');
            try {
                const res = await api.getCategories();
                const cats = res?.data || [];
                if (cats.length === 0) { showEmptyState(tbody, 'No categories found', 'bi-tags'); return; }
                tbody.innerHTML = cats.map((c, i) => `
                    <tr>
                        <td style="color:#94a3b8;font-size:12px">${i+1}</td>
                        <td>
                            <div style="display:flex;align-items:center;gap:10px">
                                <div style="width:36px;height:36px;border-radius:8px;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:16px;color:#2563eb">
                                    <i class="bi bi-tags-fill"></i>
                                </div>
                                <span style="font-weight:600">${c.name}</span>
                            </div>
                        </td>
                        <td style="color:#64748b;font-size:13px">${c.description || '—'}</td>
                        <td>
                            <span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;
                                ${c.active ? 'background:#dcfce7;color:#16a34a' : 'background:#f1f5f9;color:#64748b'}">
                                ${c.active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td>
                            <div style="display:flex;gap:6px">
                                <button class="btn-icon" onclick="openEditModal(${c.id},'${c.name.replace(/'/g,"\\'")}','${(c.description||'').replace(/'/g,"\\'")}')">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn-icon ${c.active ? 'danger' : 'success'}" onclick="toggleStatus(${c.id},'${c.name.replace(/'/g,"\\'")}',${c.active})">
                                    <i class="bi bi-${c.active ? 'toggle-on' : 'toggle-off'}"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                toast.show('Failed to load categories: ' + err.message, 'error');
                showEmptyState(tbody, 'Failed to load categories', 'bi-exclamation-circle');
            }
        }

        function openAddModal() {
            editingCatId = null;
            document.getElementById('cat-modal-title').textContent = 'Add Category';
            document.getElementById('c-name').value = '';
            document.getElementById('c-desc').value = '';
            document.getElementById('e-cname').textContent = '';
            openModal('category-modal');
        }

        function openEditModal(id, name, desc) {
            editingCatId = id;
            document.getElementById('cat-modal-title').textContent = 'Edit Category';
            document.getElementById('c-name').value = name;
            document.getElementById('c-desc').value = desc;
            document.getElementById('e-cname').textContent = '';
            openModal('category-modal');
        }

        async function saveCategory() {
            const name = document.getElementById('c-name').value.trim();
            if (!name) {
                document.getElementById('e-cname').textContent = 'Category name is required';
                return;
            }
            document.getElementById('e-cname').textContent = '';
            const btn = document.getElementById('btn-save-cat');
            btn.disabled = true;
            try {
                const data = { name, description: document.getElementById('c-desc').value.trim() };
                if (editingCatId) {
                    await api.updateCategory(editingCatId, data);
                    toast.show('Category updated!', 'success');
                } else {
                    await api.createCategory(data);
                    toast.show('Category created!', 'success');
                }
                closeModal('category-modal');
                loadCategories();
            } catch (err) {
                toast.show(err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function toggleStatus(id, name, currentlyActive) {
            if (!confirm(`${currentlyActive ? 'Deactivate' : 'Activate'} category "${name}"?`)) return;
            try {
                await api.toggleCategoryStatus(id);
                toast.show(`Category ${currentlyActive ? 'deactivated' : 'activated'}!`, 'success');
                loadCategories();
            } catch (err) {
                toast.show(err.message, 'error');
            }
        }

        loadCategories();
    </script>
</body>
</html>
