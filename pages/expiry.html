<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expiry Alerts — MEDISTOCK</title>
    <meta name="description" content="MEDISTOCK medicine expiry monitoring and alerts">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="topnav-container"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Expiry Alerts</h1>
                    <p class="page-subtitle">Monitor medicine expiry dates to prevent dispensing expired medications</p>
                </div>
                <div style="display:flex;gap:10px">
                    <button class="btn-secondary-custom" id="btn-show-expiring" onclick="showTab('expiring')" style="border-color:#d97706;color:#d97706">
                        <i class="bi bi-clock-fill"></i> Expiring Soon
                    </button>
                    <button class="btn-secondary-custom" id="btn-show-expired" onclick="showTab('expired')">
                        <i class="bi bi-x-circle-fill"></i> Expired
                    </button>
                </div>
            </div>

            <!-- Expiring Soon Tab -->
            <div id="tab-expiring">
                <div class="alert-warning-custom" style="margin-bottom:20px" id="expiring-banner" style="display:none">
                    <i class="bi bi-clock-fill"></i>
                    <span id="expiring-count-text"></span>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr><th>#</th><th>Medicine</th><th>Category</th><th>Batch</th><th>Expiry Date</th><th>Days Left</th><th>Qty</th><th>Status</th></tr>
                        </thead>
                        <tbody id="expiring-tbody">
                            <tr><td colspan="8"><div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Expired Tab -->
            <div id="tab-expired" style="display:none">
                <div class="alert-danger-custom" style="margin-bottom:20px" id="expired-banner">
                    <i class="bi bi-x-circle-fill"></i>
                    <span id="expired-count-text"></span>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr><th>#</th><th>Medicine</th><th>Category</th><th>Batch</th><th>Expiry Date</th><th>Days Overdue</th><th>Qty</th><th>Status</th></tr>
                        </thead>
                        <tbody id="expired-tbody">
                            <tr><td colspan="8"><div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script>
        if (!initLayout('Expiry Alerts')) {}

        function showTab(tab) {
            const isExpiring = tab === 'expiring';
            document.getElementById('tab-expiring').style.display = isExpiring ? '' : 'none';
            document.getElementById('tab-expired').style.display = isExpiring ? 'none' : '';
            document.getElementById('btn-show-expiring').style.borderColor = isExpiring ? '#d97706' : '';
            document.getElementById('btn-show-expiring').style.color = isExpiring ? '#d97706' : '';
            document.getElementById('btn-show-expired').style.borderColor = !isExpiring ? '#dc2626' : '';
            document.getElementById('btn-show-expired').style.color = !isExpiring ? '#dc2626' : '';
        }

        function daysFromNow(dateStr) {
            const expiry = new Date(dateStr);
            const now = new Date();
            now.setHours(0,0,0,0);
            expiry.setHours(0,0,0,0);
            return Math.floor((expiry - now) / (1000 * 60 * 60 * 24));
        }

        async function loadExpiringSoon() {
            const tbody = document.getElementById('expiring-tbody');
            try {
                const res = await api.getExpiringSoonMedicines();
                const medicines = res?.data || [];
                document.getElementById('expiring-count-text').textContent =
                    `${medicines.length} medicine${medicines.length !== 1 ? 's' : ''} will expire within 30 days. Please take action before dispensing.`;
                if (medicines.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="bi bi-check-circle-fill" style="color:#16a34a"></i><h5>No medicines expiring soon</h5><p>All medicines have more than 30 days until expiry.</p></div></td></tr>`;
                    return;
                }
                tbody.innerHTML = medicines.map((m, i) => {
                    const days = daysFromNow(m.expiryDate);
                    return `
                    <tr>
                        <td style="color:#94a3b8;font-size:12px">${i+1}</td>
                        <td><div class="med-name">${m.medicineName}</div><div class="med-generic">${m.genericName || ''}</div></td>
                        <td><span style="font-size:11px;background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:6px">${m.categoryName}</span></td>
                        <td style="font-size:12px;color:#64748b">${m.batchNumber}</td>
                        <td style="font-weight:600">${fmt.date(m.expiryDate)}</td>
                        <td>
                            <span style="font-size:14px;font-weight:700;color:${days <= 7 ? '#dc2626' : '#d97706'}">
                                ${days} day${days !== 1 ? 's' : ''}
                            </span>
                        </td>
                        <td>${m.quantity}</td>
                        <td>${fmt.expiryBadge(m.expiryStatus)}</td>
                    </tr>
                    `;
                }).join('');
            } catch (err) {
                toast.show('Failed to load expiry data: ' + err.message, 'error');
            }
        }

        async function loadExpired() {
            const tbody = document.getElementById('expired-tbody');
            try {
                const res = await api.getExpiredMedicines();
                const medicines = res?.data || [];
                document.getElementById('expired-count-text').textContent =
                    medicines.length === 0
                        ? 'No expired medicines found.'
                        : `⚠ ALERT: ${medicines.length} medicine${medicines.length !== 1 ? 's have' : ' has'} expired and must NOT be dispensed!`;
                if (medicines.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="bi bi-check-circle-fill" style="color:#16a34a"></i><h5>No expired medicines</h5></div></td></tr>`;
                    return;
                }
                tbody.innerHTML = medicines.map((m, i) => {
                    const daysOverdue = -daysFromNow(m.expiryDate);
                    return `
                    <tr>
                        <td style="color:#94a3b8;font-size:12px">${i+1}</td>
                        <td><div class="med-name">${m.medicineName}</div><div class="med-generic">${m.genericName || ''}</div></td>
                        <td><span style="font-size:11px;background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:6px">${m.categoryName}</span></td>
                        <td style="font-size:12px;color:#64748b">${m.batchNumber}</td>
                        <td style="font-weight:600;color:#dc2626">${fmt.date(m.expiryDate)}</td>
                        <td><span style="font-size:14px;font-weight:700;color:#dc2626">${daysOverdue} day${daysOverdue !== 1 ? 's' : ''} overdue</span></td>
                        <td>${m.quantity}</td>
                        <td>${fmt.expiryBadge(m.expiryStatus)}</td>
                    </tr>
                    `;
                }).join('');
            } catch (err) {
                toast.show('Failed to load expired data: ' + err.message, 'error');
            }
        }

        loadExpiringSoon();
        loadExpired();
    </script>
</body>
</html>
