<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders — MEDISTOCK</title>
    <meta name="description" content="MEDISTOCK order management - create and process pharmacy orders">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="topnav-container"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Orders</h1>
                    <p class="page-subtitle">Create and manage pharmacy orders</p>
                </div>
                <button class="btn-primary-custom" onclick="openCreateOrder()">
                    <i class="bi bi-plus-lg"></i> New Order
                </button>
            </div>

            <!-- Orders Table -->
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Order Number</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Processed By</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody">
                        <tr><td colspan="9"><div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div><p>Loading orders...</p></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create Order Modal -->
    <div class="modal-overlay" id="create-order-modal">
        <div class="modal-box" style="max-width:700px">
            <div class="modal-header">
                <h5 class="modal-title">New Order</h5>
                <button class="modal-close" onclick="closeModal('create-order-modal')"><i class="bi bi-x"></i></button>
            </div>
            <div class="modal-body">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
                    <div class="form-group" style="margin-bottom:0">
                        <label class="form-label required">Customer Name</label>
                        <input type="text" class="form-control-custom" id="o-customer" placeholder="Enter customer name" required>
                        <div class="form-error" id="e-customer"></div>
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label class="form-label required">Phone Number</label>
                        <input type="text" class="form-control-custom" id="o-phone" placeholder="Enter phone number" required>
                        <div class="form-error" id="e-phone"></div>
                    </div>
                </div>

                <div style="border:1.5px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:20px">
                    <div style="font-size:13px;font-weight:600;margin-bottom:12px;color:#374151">
                        <i class="bi bi-capsule" style="color:#2563eb"></i> Order Items
                    </div>
                    <div id="order-items-list"></div>
                    <button class="btn-secondary-custom" onclick="addOrderItem()" style="margin-top:10px;width:100%;justify-content:center">
                        <i class="bi bi-plus-lg"></i> Add Item
                    </button>
                </div>

                <div style="background:#f8fafc;border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:center">
                    <span style="font-size:14px;font-weight:600;color:#374151">Estimated Total</span>
                    <span style="font-size:22px;font-weight:700;color:#0f172a" id="order-total">₹0.00</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary-custom" onclick="closeModal('create-order-modal')">Cancel</button>
                <button class="btn-primary-custom" onclick="submitOrder()" id="btn-submit-order">
                    <i class="bi bi-cart-plus"></i> Place Order
                </button>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div class="modal-overlay" id="order-details-modal">
        <div class="modal-box" style="max-width:620px">
            <div class="modal-header">
                <h5 class="modal-title">Order Details</h5>
                <button class="modal-close" onclick="closeModal('order-details-modal')"><i class="bi bi-x"></i></button>
            </div>
            <div class="modal-body" id="order-details-body">
                Loading...
            </div>
            <div class="modal-footer" id="order-details-actions"></div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script>
        if (!initLayout('Orders')) {}

        let medicines = [];
        let orderItemsCount = 0;

        async function loadOrders() {
            const tbody = document.getElementById('orders-tbody');
            try {
                const res = await api.getOrders();
                const orders = res?.data || [];
                if (orders.length === 0) {
                    showEmptyState(tbody, 'No orders yet', 'bi-cart');
                    return;
                }
                tbody.innerHTML = orders.map((o, i) => `
                    <tr>
                        <td style="color:#94a3b8;font-size:12px">${i+1}</td>
                        <td><strong>${o.orderNumber}</strong></td>
                        <td>${o.customerName}</td>
                        <td style="font-size:12px;color:#64748b">${o.customerPhone}</td>
                        <td style="font-weight:700">${fmt.currency(o.totalAmount)}</td>
                        <td>${fmt.orderStatusBadge(o.status)}</td>
                        <td style="font-size:12px">${fmt.datetime(o.createdAt)}</td>
                        <td style="font-size:12px;color:#64748b">${o.processedByName}</td>
                        <td>
                            <div style="display:flex;gap:6px">
                                <button class="btn-icon" onclick="viewOrder(${o.id})" title="View Details">
                                    <i class="bi bi-eye"></i>
                                </button>
                                ${getActionButtons(o)}
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                toast.show('Failed to load orders: ' + err.message, 'error');
                showEmptyState(tbody, 'Failed to load orders', 'bi-exclamation-circle');
            }
        }

        function getActionButtons(o) {
            const btns = [];
            if (o.status === 'PENDING') btns.push(`<button class="btn-icon success" onclick="updateStatus(${o.id},'CONFIRMED')" title="Confirm"><i class="bi bi-check-lg"></i></button>`);
            if (o.status === 'CONFIRMED') btns.push(`<button class="btn-icon" onclick="updateStatus(${o.id},'PREPARING')" title="Mark Preparing" style="border-color:#7c3aed;color:#7c3aed"><i class="bi bi-hourglass-split"></i></button>`);
            if (o.status === 'PREPARING') btns.push(`<button class="btn-icon success" onclick="updateStatus(${o.id},'COMPLETED')" title="Mark Completed"><i class="bi bi-check-circle"></i></button>`);
            if (o.status === 'PENDING') btns.push(`<button class="btn-icon danger" onclick="cancelOrder(${o.id})" title="Cancel"><i class="bi bi-x-circle"></i></button>`);
            return btns.join('');
        }

        async function updateStatus(id, status) {
            try {
                await api.updateOrderStatus(id, status);
                toast.show(`Order status updated to ${status}`, 'success');
                loadOrders();
            } catch (err) {
                toast.show(err.message, 'error');
            }
        }

        async function cancelOrder(id) {
            if (!confirm('Cancel this order?')) return;
            try {
                await api.cancelOrder(id);
                toast.show('Order cancelled', 'warning');
                loadOrders();
            } catch (err) {
                toast.show(err.message, 'error');
            }
        }

        async function viewOrder(id) {
            openModal('order-details-modal');
            const body = document.getElementById('order-details-body');
            const actions = document.getElementById('order-details-actions');
            body.innerHTML = '<div style="text-align:center;padding:30px"><div class="spinner" style="margin:0 auto"></div></div>';
            actions.innerHTML = '';
            try {
                const res = await api.getOrderById(id);
                const o = res.data;
                body.innerHTML = `
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
                        <div>
                            <div style="font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Order Number</div>
                            <div style="font-size:15px;font-weight:700;color:#0f172a">${o.orderNumber}</div>
                        </div>
                        <div>
                            <div style="font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Status</div>
                            <div>${fmt.orderStatusBadge(o.status)}</div>
                        </div>
                        <div>
                            <div style="font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Customer</div>
                            <div style="font-size:14px;font-weight:600">${o.customerName}</div>
                        </div>
                        <div>
                            <div style="font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Phone</div>
                            <div style="font-size:14px">${o.customerPhone}</div>
                        </div>
                        <div>
                            <div style="font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Date</div>
                            <div style="font-size:13px">${fmt.datetime(o.createdAt)}</div>
                        </div>
                        <div>
                            <div style="font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Processed By</div>
                            <div style="font-size:13px">${o.processedByName}</div>
                        </div>
                    </div>
                    <div style="border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:16px">
                        <table style="width:100%;border-collapse:collapse">
                            <thead style="background:#f8fafc">
                                <tr>
                                    <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">Medicine</th>
                                    <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">Qty</th>
                                    <th style="padding:10px 14px;text-align:right;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">Price</th>
                                    <th style="padding:10px 14px;text-align:right;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${(o.items || []).map(item => `
                                    <tr style="border-top:1px solid #f1f5f9">
                                        <td style="padding:12px 14px;font-size:13px;font-weight:500">${item.medicineName}</td>
                                        <td style="padding:12px 14px;text-align:center;font-size:13px">${item.quantity}</td>
                                        <td style="padding:12px 14px;text-align:right;font-size:13px">${fmt.currency(item.unitPrice)}</td>
                                        <td style="padding:12px 14px;text-align:right;font-size:13px;font-weight:600">${fmt.currency(item.subtotal)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                            <tfoot style="border-top:2px solid #e2e8f0;background:#f8fafc">
                                <tr>
                                    <td colspan="3" style="padding:12px 14px;font-size:14px;font-weight:700;text-align:right">Total</td>
                                    <td style="padding:12px 14px;font-size:16px;font-weight:700;text-align:right;color:#2563eb">${fmt.currency(o.totalAmount)}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                `;
            } catch (err) {
                body.innerHTML = `<div class="alert-danger-custom"><i class="bi bi-x-circle"></i> Failed to load order details</div>`;
            }
        }

        async function openCreateOrder() {
            medicines = [];
            orderItemsCount = 0;
            document.getElementById('o-customer').value = '';
            document.getElementById('o-phone').value = '';
            document.getElementById('e-customer').textContent = '';
            document.getElementById('e-phone').textContent = '';
            document.getElementById('order-items-list').innerHTML = '';
            updateOrderTotal();

            try {
                const res = await api.getMedicines('', '', 'true');
                medicines = (res?.data || []).filter(m => m.active && m.expiryStatus !== 'EXPIRED');
            } catch (e) { medicines = []; }

            addOrderItem();
            openModal('create-order-modal');
        }

        function addOrderItem() {
            orderItemsCount++;
            const idx = orderItemsCount;
            const container = document.getElementById('order-items-list');
            const div = document.createElement('div');
            div.id = `item-row-${idx}`;
            div.style.cssText = 'display:grid;grid-template-columns:1fr 80px auto;gap:10px;margin-bottom:10px;align-items:start';
            div.innerHTML = `
                <div>
                    <select class="form-control-custom item-medicine-select" data-idx="${idx}" onchange="updateItemPrice(${idx})">
                        <option value="">Select medicine...</option>
                        ${medicines.map(m => `<option value="${m.id}" data-price="${m.price}" data-qty="${m.quantity}">${m.medicineName} (Qty: ${m.quantity}) — ${fmt.currency(m.price)}</option>`).join('')}
                    </select>
                </div>
                <div>
                    <input type="number" class="form-control-custom item-qty" data-idx="${idx}" min="1" value="1" placeholder="Qty" oninput="updateOrderTotal()">
                </div>
                <button class="btn-icon danger" onclick="removeOrderItem(${idx})" style="margin-top:0" title="Remove">
                    <i class="bi bi-trash"></i>
                </button>
            `;
            container.appendChild(div);
        }

        function removeOrderItem(idx) {
            document.getElementById(`item-row-${idx}`)?.remove();
            updateOrderTotal();
        }

        function updateItemPrice(idx) {
            updateOrderTotal();
        }

        function updateOrderTotal() {
            let total = 0;
            document.querySelectorAll('.item-medicine-select').forEach(sel => {
                const idx = sel.getAttribute('data-idx');
                const qtyEl = document.querySelector(`.item-qty[data-idx="${idx}"]`);
                if (!sel.value || !qtyEl) return;
                const price = parseFloat(sel.selectedOptions[0]?.getAttribute('data-price') || 0);
                const qty = parseInt(qtyEl.value || 0);
                total += price * qty;
            });
            document.getElementById('order-total').textContent = fmt.currency(total);
        }

        async function submitOrder() {
            let valid = true;
            const customer = document.getElementById('o-customer').value.trim();
            const phone = document.getElementById('o-phone').value.trim();
            if (!customer) { document.getElementById('e-customer').textContent = 'Customer name required'; valid = false; }
            else document.getElementById('e-customer').textContent = '';
            if (!phone) { document.getElementById('e-phone').textContent = 'Phone number required'; valid = false; }
            else document.getElementById('e-phone').textContent = '';

            const items = [];
            document.querySelectorAll('.item-medicine-select').forEach(sel => {
                if (!sel.value) return;
                const idx = sel.getAttribute('data-idx');
                const qty = parseInt(document.querySelector(`.item-qty[data-idx="${idx}"]`)?.value || 0);
                if (qty > 0) items.push({ medicineId: parseInt(sel.value), quantity: qty });
            });

            if (items.length === 0) {
                toast.show('Please add at least one item to the order', 'warning');
                valid = false;
            }
            if (!valid) return;

            const btn = document.getElementById('btn-submit-order');
            btn.disabled = true;
            try {
                const data = { customerName: customer, customerPhone: phone, items };
                await api.createOrder(data);
                toast.show('Order created successfully!', 'success');
                closeModal('create-order-modal');
                loadOrders();
            } catch (err) {
                toast.show(err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        loadOrders();
    </script>
</body>
</html>
