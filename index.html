<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=pages/login.html">
    <title>MEDISTOCK — Redirecting...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>MEDISTOCK</h2>
        <p>Redirecting to application...</p>
        <p><small>If you are not redirected automatically, <a href="pages/login.html">click here</a>.</small></p>
    </div>
    <script>
        const target = localStorage.getItem('medistock_token') 
            ? 'pages/dashboard.html' 
            : 'pages/login.html';
        window.location.href = target;
    </script>
</body>
</html>
